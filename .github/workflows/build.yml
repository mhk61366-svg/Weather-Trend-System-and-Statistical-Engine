name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # ← MUST be windows-latest for .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # use the same version you develop with

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "MyApp" main.py
          # Replace "main.py" with your actual entry point file

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Windows
          path: dist/MyApp.exe